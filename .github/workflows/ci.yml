name: CI & Publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Check Formatting
        run: pnpm run format:check

      - name: Typecheck All Workspaces
        run: pnpm run typecheck

      - name: Build All Packages
        run: pnpm run build

      - name: Run Tests
        run: pnpm run test

      - name: Run Tests with Coverage (hooks)
        run: pnpm --filter @figmavars/hooks run test:coverage
        env:
          VITE_FIGMA_TOKEN: ${{ secrets.VITE_FIGMA_TOKEN }}
          VITE_FIGMA_FILE_KEY: ${{ secrets.VITE_FIGMA_FILE_KEY }}

      - name: Upload Coverage Report (GitHub Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: packages/hooks/coverage/

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./packages/hooks/coverage/lcov.info
          flags: unittests
          name: codecov-coverage
          fail_ci_if_error: true

      - name: Check Release Packages
        run: pnpm run check:release

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'
          scope: '@figmavars'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build All Packages
        run: pnpm run build

      - name: Publish to NPM
        run: >-
          pnpm
          --filter @figmavars/core
          --filter @figmavars/dtcg
          --filter @figmavars/cli
          --filter @figmavars/hooks
          --filter @figmavars/mcp
          -r publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
