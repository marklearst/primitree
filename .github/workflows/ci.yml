name: CI & Publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.10.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint
        run: pnpm run lint

      - name: Check formatting
        run: pnpm run format:check

      - name: Typecheck all workspaces
        run: pnpm run typecheck

      - name: Build all packages
        run: pnpm run build

      - name: Run tests
        run: pnpm run test

      - name: Run tests with coverage
        run: pnpm run test:coverage

      - name: Install Chromium
        run: pnpm run test:e2e:install

      - name: Run browser tests
        run: pnpm run test:e2e

      - name: Validate release tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-next\.[0-9]+)?$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-next.N" >&2
            exit 1
          fi
          pnpm run check:release-metadata
          node scripts/release-publish.mjs exact-main

      - name: Check built release packages
        run: pnpm run check:release:built

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: packages/*/coverage/
          if-no-files-found: error

      - name: Upload to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          use_oidc: true
          files: ./packages/core/coverage/lcov.info,./packages/dtcg/coverage/lcov.info,./packages/cli/coverage/lcov.info,./packages/hooks/coverage/lcov.info,./packages/mcp/coverage/lcov.info
          disable_search: true
          fail_ci_if_error: true

      - name: Upload npm release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-packages-${{ github.sha }}
          path: artifacts/npm/
          if-no-files-found: error

  packed-consumer:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0

      - name: Download npm release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-packages-${{ github.sha }}
          path: artifacts/npm

      - name: Verify and smoke-test tarballs
        run: node scripts/release-publish.mjs packed-consumer

  publish:
    if: github.event.deleted != true && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    needs: [quality, packed-consumer]
    timeout-minutes: 30
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0

      - name: Install and assert npm
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@11.18.0
          test "$(npm --version)" = "11.18.0"

      - name: Require tag at current origin main
        run: node scripts/release-publish.mjs exact-main

      - name: Download npm release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-packages-${{ github.sha }}
          path: artifacts/npm

      - name: Verify release artifact boundary
        run: node scripts/release-artifacts.mjs verify

      - name: Publish and verify npm packages
        run: node scripts/release-publish.mjs publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify clean public registry consumer
        run: node scripts/release-publish.mjs public-consumer

  github-release:
    if: github.event.deleted != true && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    needs: [publish]
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0

      - name: Download npm release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-packages-${{ github.sha }}
          path: artifacts/npm

      - name: Create or resume GitHub Release
        run: node scripts/github-release.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
